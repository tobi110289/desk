<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Desk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      content="#f6f5f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#15140f"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="robots" content="noindex" />
    <title>Desk</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <h1 id="title">Desk</h1>
        <div id="meta"></div>
      </header>
      <main id="scroll"></main>
      <footer id="dock">
        <div id="busy" aria-hidden="true"></div>
        <div id="toast" role="status" hidden></div>
        <button id="strip" type="button" hidden></button>
        <div id="searchbar" hidden>
          <input
            id="search"
            type="search"
            placeholder="Search cards"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="search"
            aria-label="Search cards"
          />
          <button id="search-end" type="button">Cancel</button>
        </div>
        <nav id="keys" aria-label="Actions"></nav>
        <div id="attach" hidden></div>
        <form id="say">
          <button id="pic" type="button" class="key" aria-label="Add a picture">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" />
              <circle cx="9" cy="10.5" r="1.6" />
              <path d="m5 17 4.5-4 3.5 3 2.5-2 3.5 3" />
            </svg>
          </button>
          <textarea
            id="text"
            rows="1"
            placeholder="Write to Claude"
            aria-label="Message to Claude"
            enterkeyhint="enter"
          ></textarea>
          <button
            id="mic"
            type="button"
            class="key"
            aria-label="Dictate"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3.5" width="6" height="11" rx="3" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5" />
            </svg>
          </button>
          <button
            id="send"
            type="submit"
            class="key go"
            aria-label="Send"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5.5M6 11l6-6 6 6" />
            </svg>
          </button>
          <input id="file" type="file" accept="image/*" hidden />
        </form>
      </footer>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
